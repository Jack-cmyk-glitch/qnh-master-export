[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qnh-master-export"
version = "0.1.0"
description = "Export QianNiuHua product masters through an authenticated OpenCLI browser session."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "QNH Master Export contributors"}]
dependencies = ["openpyxl>=3.1.5,<4"]
keywords = ["qnh", "retail", "opencli", "product-master", "excel"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/Jack-cmyk-glitch/qnh-master-export"
Issues = "https://github.com/Jack-cmyk-glitch/qnh-master-export/issues"

[project.scripts]
qnh-master = "qnh_master_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
